<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="100%" height="100%">
  <defs>
    <!-- GRADIENT FOR PYTHON ICON -->
    <linearGradient id="python-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .header { fill: #161b22; }
      .header-border { stroke: #30363d; stroke-width: 1; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; }
      .code-text { font-family: 'Fira Code', 'Cascadia Code', 'Consolas', 'Courier New', monospace; font-size: 14px; }
      .line-num { fill: #484f58; font-weight: 400; }
      .keyword { fill: #ff7b72; font-weight: 600; }
      .fn { fill: #d2a8ff; }
      .str { fill: #a5d6ff; }
      .type { fill: #ffa657; }
      .var { fill: #79c0ff; }
      .punct { fill: #c9d1d9; }
      .tag { fill: #7ee787; }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s infinite;
        fill: #38bdf8;
      }

      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.35)); }
        50% { filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.7)); }
      }
      .terminal-frame {
        animation: glow 4s ease-in-out infinite;
      }
    </style>
  </defs>

